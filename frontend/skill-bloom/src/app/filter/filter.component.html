<div class="filter-container">
    <div class="range-labels">
      <div class="label">Anspannungslevel:</div> 
      <div class="value">{{stressRange.lower}} - {{stressRange.upper}}</div>
    </div>

    <ion-range
      [dualKnobs]="true"
      class="custom-range"
      [step]="1"
      [pin]="true"
      [value]="stressRange"
      (ionChange)="stressRange = $any($event.detail.value); rangeChange.emit(stressRange)"
      >
    </ion-range>
</div>
